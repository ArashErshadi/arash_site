<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#f4f2eb"/>
  
  <!-- Architectural Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(26,26,25,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Architectural Frame & Hairlines -->
  <rect x="60" y="60" width="1480" height="880" fill="none" stroke="rgba(26,26,25,0.15)" stroke-width="1"/>
  <line x1="60" y1="140" x2="1540" y2="140" stroke="rgba(26,26,25,0.12)" stroke-width="1"/>
  <line x1="60" y1="860" x2="1540" y2="860" stroke="rgba(26,26,25,0.12)" stroke-width="1"/>

  <!-- Technical Drawing Composition -->
  <g transform="translate(140, 200)">
    <!-- Axonometric / Plan geometric lines -->
    <polygon points="200,450 650,200 1100,450 650,700" fill="none" stroke="#1a1a19" stroke-width="2"/>
    <polygon points="200,350 650,100 1100,350 650,600" fill="rgba(184,93,59,0.06)" stroke="#b85d3b" stroke-width="2"/>
    
    <line x1="200" y1="450" x2="200" y2="350" stroke="#1a1a19" stroke-width="2"/>
    <line x1="650" y1="200" x2="650" y2="100" stroke="#1a1a19" stroke-width="2"/>
    <line x1="1100" y1="450" x2="1100" y2="350" stroke="#1a1a19" stroke-width="2"/>
    <line x1="650" y1="700" x2="650" y2="600" stroke="#1a1a19" stroke-width="2"/>

    <!-- Internal Courtyard Cutout -->
    <polygon points="500,380 650,300 800,380 650,460" fill="#f4f2eb" stroke="#1a1a19" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="650" cy="380" r="28" fill="none" stroke="#b85d3b" stroke-width="1.5"/>

    <!-- Radial Rhythm Lines -->
    <line x1="650" y1="100" x2="650" y2="0" stroke="rgba(26,26,25,0.3)" stroke-width="1"/>
    <line x1="200" y1="350" x2="100" y2="300" stroke="rgba(26,26,25,0.3)" stroke-width="1"/>
    <line x1="1100" y1="350" x2="1200" y2="300" stroke="rgba(26,26,25,0.3)" stroke-width="1"/>
  </g>

  <!-- Scale Bar & Compass -->
  <g transform="translate(1360, 90)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#1a1a19" stroke-width="1"/>
    <path d="M 20 8 L 24 20 L 20 17 L 16 20 Z" fill="#1a1a19"/>
    <text x="20" y="32" font-family="monospace" font-size="9" text-anchor="middle" fill="#73726e">N</text>
  </g>

  <!-- Title Plate -->
  <text x="90" y="105" font-family="serif" font-size="24" font-weight="500" fill="#1a1a19">Desert Cultural Center & Water Pavilion</text>
  <text x="90" y="128" font-family="sans-serif" font-size="13" letter-spacing="1.5" fill="#73726e">YAZD / 2025 / CULTURAL & CIVIC</text>
  
  <!-- Scale label -->
  <text x="1440" y="890" font-family="monospace" font-size="12" text-anchor="end" fill="#73726e">SCALE 1:200 @ A1</text>
  <text x="90" y="890" font-family="monospace" font-size="12" fill="#73726e">MONOGRAPH PLATE // ARCHITECTURAL STUDY</text>
</svg>